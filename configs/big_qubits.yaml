# large-n check: does concentration grow with qubits, and does a small bandwidth rescue it?
name: big_qubits
data: data/atlas-higgs-challenge-2014-v2.csv.gz
n_train: [500]
n_test: 1000
seeds: [0, 1, 2, 3, 4]
qubits: [12, 14]
feature_maps: [{kind: zz, reps: 2}]
bandwidths: [0.1, 1.0]
lambdas: [0.001, 0.01, 0.1]
projected: true
